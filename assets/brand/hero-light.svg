<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" role="img" aria-labelledby="title desc">
<title id="title">CarryTrace. Your work continues.</title>
<desc id="desc">The continuity skill for AI agents. Keep decisions, trace evidence, continue work. Decorative illustration, not measured task performance.</desc>
<style>@keyframes travel{0%{stroke-dashoffset:280}100%{stroke-dashoffset:0}}.trace{stroke-dasharray:280;animation:travel 4.6s ease-out 1}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style>
