<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" role="img" aria-labelledby="title desc">
<title id="title">ClaimLedger. Your work continues.</title>
<desc id="desc">The decision ledger for AI agents. Claims carry a status: current, superseded or disputed. Decorative illustration, not measured task performance.</desc>
<style>@keyframes draw{0%{stroke-dashoffset:260}100%{stroke-dashoffset:0}}.bar{stroke-dasharray:260;animation:draw 1.1s ease-out both}.b1{animation-delay:.1s}.b2{animation-delay:.4s}.b3{animation-delay:.7s}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style>
