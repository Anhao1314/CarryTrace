<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" role="img" aria-labelledby="title desc">
<title id="title">CarryTrace. Your work continues.</title>
<desc id="desc">The continuity skill for AI agents. Keep decisions, trace evidence, continue work. Decorative illustration, not measured task performance.</desc>

<rect x="1" y="1" width="958" height="356" rx="22" fill="#142035" stroke="#34435a"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="43" font-size="12" font-weight="700" letter-spacing="2" fill="#a9b6c8">AI AGENT / CONTINUITY SKILL</text>
<rect x="791" y="22" width="128" height="30" rx="15" fill="#1d2e46"/>
<circle cx="809" cy="37" r="4" fill="#c2f586"/>
<text x="822" y="41" font-size="11" font-weight="700" letter-spacing="1" fill="#f4f5ef">LOCAL FIRST</text>
<text x="37" y="146" font-size="78" font-weight="800" letter-spacing="-4" fill="#f4f5ef">CarryTrace<tspan fill="#c2f586">.</tspan></text>
<path d="M43 166 Q182 179 328 166" fill="none" stroke="#b9e780" stroke-width="7" stroke-linecap="round"/>
<text x="40" y="217" font-size="30" font-weight="700" letter-spacing="-.5" fill="#f4f5ef">Your work continues.</text>
<text x="40" y="250" font-size="17" fill="#a9b6c8">Keep the decisions. Bring the evidence.</text>
<line x1="40" y1="291" x2="920" y2="291" stroke="#34435a"/>
<text x="40" y="324" font-size="11" font-weight="700" letter-spacing="1.4" fill="#a9b6c8">FORMERLY CHAT-DISTILLER</text>
<text x="588" y="324" font-size="11" font-weight="700" letter-spacing="1.1" fill="#a9b6c8">DECISIONS / EVIDENCE / NEXT STEPS</text>
