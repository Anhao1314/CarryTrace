name: publish

# Publish to PyPI via Trusted Publishing (OIDC): no API token is stored.
# One-time setup on https://pypi.org/manage/account/publishing/ — add a
# "pending publisher" with:
#   owner: Anhao1314  repository: ClaimLedger  workflow: publish.yml
#   environment: pypi
# After that, every published GitHub Release is uploaded to PyPI automatically.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python3 -m pip install "setuptools>=61" wheel build
          python3 -m build --no-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
